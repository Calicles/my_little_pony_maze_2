name: Android

on:
  push:
    branches: [master]
    paths: ['gdx/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['gdx/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gdx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, APK et version PC
        run: ./gradlew --no-daemon core:test android:assembleDebug lwjgl3:dist

      - name: Renommer les fichiers
        run: |
          mkdir -p ../out
          cp android/build/outputs/apk/debug/android-debug.apk ../out/ponymaze.apk
          cp lwjgl3/build/libs/ponymaze-*.jar ../out/ponymaze-pc.jar

      - uses: actions/upload-artifact@v4
        with:
          name: ponymaze
          path: out/

      # Sur master, chaque version est publiée : le lien
      # https://github.com/Calicles/my_little_pony_maze_2/releases/latest/download/ponymaze.apk
      # télécharge toujours la dernière.
      - name: Publier la version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Version ${{ github.run_number }}
          make_latest: true
          body: |
            **Android** : télécharge `ponymaze.apk` depuis le téléphone, puis ouvre-le pour l'installer
            (autorise l'installation depuis cette source si Android le demande).

            **PC** : `ponymaze-pc.jar` se lance avec Java 11 ou plus récent (`java -jar ponymaze-pc.jar`).
          files: |
            out/ponymaze.apk
            out/ponymaze-pc.jar
